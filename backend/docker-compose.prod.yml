services:
  db:
    image: postgres:16-alpine
    container_name: jari_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: jari_db
      POSTGRES_USER: jari_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - jari_pgdata:/var/lib/postgresql/data
    networks:
      - jari_internal_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jari_user -d jari_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jari_backend_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env.production
    volumes:
      - jari_uploads:/app/uploads
    networks:
      - jari_internal_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  jari_pgdata:
    name: jari_pgdata
  jari_uploads:
    name: jari_uploads

networks:
  jari_internal_net:
    name: jari_internal_net
    driver: bridge

